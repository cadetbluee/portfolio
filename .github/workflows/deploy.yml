name: Deploy to GitHub Pages

on:
  # master 에 push 되면 자동 배포
  push:
    branches: [master]
  # Actions 탭에서 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # CRA 앱은 저장소 루트가 아니라 portfolio/ 안에 있다
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build

      # GitHub Pages 는 서버 라우팅이 없어 /project/donhaeng 같은 주소를 직접
      # 열면 404 를 준다. 404.html 을 index.html 과 같게 두면 그 응답으로
      # 앱이 부팅되고 React Router 가 주소를 읽어 정상 렌더한다.
      - name: SPA 라우팅용 404 폴백
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
